spring:
  profiles:
    default: local

  application:
    name: user-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json

  datasource:
    username: ${DB_USERNAME:user_service}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/master.yaml

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}

logging:
  level:
    org.hibernate.SQL: debug
